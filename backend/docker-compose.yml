services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paper_reader
      POSTGRES_USER: paper_reader
      POSTGRES_PASSWORD: paper_reader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  dufs:
    image: sigoden/dufs:latest
    ports:
      - "8400:5000"
    command: /data --allow-upload --allow-delete --allow-search
    volumes:
      - filedata:/data

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"

volumes:
  pgdata:
  redisdata:
  filedata:
