spring:
  application:
    name: paper-reader

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:paper_reader}
    username: ${DATABASE_USER:paper_reader}
    password: ${DATABASE_PASSWORD:paper_reader}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  storage:
    type: ${STORAGE_TYPE:dufs}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}

  dufs:
    url: ${DUFS_URL:http://localhost:8400}

  grobid:
    base-url: ${GROBID_BASE_URL:http://localhost:8070}
    timeout: ${GROBID_TIMEOUT:60000}

  mail:
    from: ${MAIL_FROM:noreply@paperreader.local}

  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o}

    claude:
      api-key: ${CLAUDE_API_KEY:}
      base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com}
      model: ${CLAUDE_MODEL:claude-sonnet-4-20250514}

    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}

    qwen:
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_MODEL:qwen-max}

logging:
  level:
    org.paperreader: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: development

logging:
  level:
    org.paperreader: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    org.paperreader: INFO
